name: STALK Agent Network — Daily Run

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Which agent to run (all / ceo / cto / cpo / ios_dev / ux / cro / reporter)'
        required: false
        default: 'all'

# Minimum permissions — only grant what each job needs
permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  # ── 1. CEO — Alex sets the agenda ──────────────────────────────────────────
  ceo:
    name: Alex (CEO)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.agent == 'all' || github.event.inputs.agent == 'ceo' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Alex — STALK CEO Agent"
          git config user.email "agent-alex@stalk.app"

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Alex (CEO)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py ceo

      - name: Commit outputs
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Alex/CEO]: Daily agenda $TODAY [skip ci]" && git push)

  # ── 2. CTO — Maya reviews architecture ─────────────────────────────────────
  cto:
    name: Maya (CTO)
    runs-on: ubuntu-latest
    needs: ceo
    if: ${{ always() && (github.event.inputs.agent == 'all' || github.event.inputs.agent == 'cto') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Maya — STALK CTO Agent"
          git config user.email "agent-maya@stalk.app"

      - name: Pull latest
        run: git pull origin main

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Maya (CTO)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py cto

      - name: Commit outputs
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Maya/CTO]: Architecture review $TODAY [skip ci]" && git push)

  # ── 3. iOS Dev — Jordan audits Swift code ──────────────────────────────────
  ios_dev:
    name: Jordan (iOS Dev)
    runs-on: ubuntu-latest
    needs: cto
    if: ${{ always() && (github.event.inputs.agent == 'all' || github.event.inputs.agent == 'ios_dev') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Jordan — STALK iOS Dev Agent"
          git config user.email "agent-jordan@stalk.app"

      - name: Pull latest
        run: git pull origin main

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Jordan (iOS Dev)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py ios_dev

      - name: Commit outputs
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Jordan/iOS]: Dev log $TODAY [skip ci]" && git push)

  # ── 4. UX — Luna audits design ─────────────────────────────────────────────
  ux:
    name: Luna (UX)
    runs-on: ubuntu-latest
    needs: ios_dev
    if: ${{ always() && (github.event.inputs.agent == 'all' || github.event.inputs.agent == 'ux') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Luna — STALK UX Agent"
          git config user.email "agent-luna@stalk.app"

      - name: Pull latest
        run: git pull origin main

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Luna (UX)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py ux

      - name: Commit outputs
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Luna/UX]: Design audit $TODAY [skip ci]" && git push)

  # ── 5. CPO — Sam drives product ────────────────────────────────────────────
  cpo:
    name: Sam (CPO)
    runs-on: ubuntu-latest
    needs: ux
    if: ${{ always() && (github.event.inputs.agent == 'all' || github.event.inputs.agent == 'cpo') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Sam — STALK CPO Agent"
          git config user.email "agent-sam@stalk.app"

      - name: Pull latest
        run: git pull origin main

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Sam (CPO)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py cpo

      - name: Commit outputs
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Sam/CPO]: Product priorities $TODAY [skip ci]" && git push)

  # ── 6. CRO — Rex drives revenue ────────────────────────────────────────────
  cro:
    name: Rex (CRO)
    runs-on: ubuntu-latest
    needs: cpo
    if: ${{ always() && (github.event.inputs.agent == 'all' || github.event.inputs.agent == 'cro') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Rex — STALK CRO Agent"
          git config user.email "agent-rex@stalk.app"

      - name: Pull latest
        run: git pull origin main

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Rex (CRO)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py cro

      - name: Commit outputs
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Rex/CRO]: Revenue analysis $TODAY [skip ci]" && git push)

  # ── 7. Reporter — Dana writes the daily report ─────────────────────────────
  reporter:
    name: Dana (Reporter)
    runs-on: ubuntu-latest
    needs: cro
    if: ${{ always() && (github.event.inputs.agent == 'all' || github.event.inputs.agent == 'reporter') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Dana — STALK Reporter Agent"
          git config user.email "agent-dana@stalk.app"

      - name: Pull latest
        run: git pull origin main

      - name: Install Anthropic SDK (pinned)
        run: pip install "anthropic==0.52.0" --quiet

      - name: Run Dana (Reporter)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/run_agent.py reporter

      - name: Commit Dana report
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          git add agents/
          git diff --staged --quiet || (git commit -m "Agent[Dana/Reporter]: Daily report $TODAY [skip ci]" && git push)
