name: STALK Agent Network — PR Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'STALK/**/*.swift'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Maya reviews the code architecture ─────────────────────────────────────
  cto-review:
    name: Maya (CTO) — Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Get changed Swift files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.swift$' | head -8 | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed Swift files: $FILES"

      - name: Maya reviews PR
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILES="${{ steps.changed.outputs.files }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          REVIEW=$(claude --print "
          You are Maya, CTO of STALK. A PR just came in.

          PR: #$PR_NUMBER — $PR_TITLE
          Changed Swift files: $CHANGED_FILES

          Read the changed files listed above, then run: git diff origin/${{ github.base_ref }}...HEAD -- $CHANGED_FILES

          Write a concise code review comment covering:
          1. Architecture — any violations of STALK patterns (@Observable, Swift 6, MainActor)?
          2. Bugs — anything that will crash or behave wrong?
          3. Performance — anything expensive on main thread?
          4. Design system — correct use of Theme.swift tokens?
          5. Approval — end with LGTM ✓ or REQUEST CHANGES with specific items

          Keep it under 200 words. Be direct, like a senior iOS engineer.
          " 2>&1 || echo "Review generation failed")

          echo "REVIEW<<EOF" >> $GITHUB_ENV
          echo "$REVIEW" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## Maya (CTO) Code Review

          ${{ env.REVIEW }}

          ---
          *Automated review by STALK Agent Network*"

  # ── Jordan checks iOS-specific patterns ────────────────────────────────────
  ios-patterns:
    name: Jordan (iOS Dev) — Pattern Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Jordan checks patterns
        id: patterns
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.swift$' | head -5 | tr '\n' ' ')

          NOTES=$(claude --print "
          You are Jordan, iOS Dev at STALK. Quick pattern check on this PR.

          Changed files: $CHANGED

          Run: git diff origin/${{ github.base_ref }}...HEAD -- $CHANGED

          Check ONLY for these specific STALK anti-patterns:
          - ObservableObject used instead of @Observable macro
          - Hardcoded colors instead of Theme.swift tokens
          - Emoji in code (we use SF Symbols)
          - UserDefaults called outside AppState
          - Any non-MainActor async that touches UI

          List only actual violations found, one line each, with file:line.
          If none found, write: All patterns ✓
          Max 5 lines total.
          " 2>&1 || echo "Pattern check failed")

          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post pattern check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## Jordan (iOS Dev) Pattern Check

          ${{ env.NOTES }}

          ---
          *Automated check by STALK Agent Network*"
